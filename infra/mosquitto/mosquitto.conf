# Sentinel-X — Mosquitto 2.0 (broker MQTT du Pi)
# Monté en lecture seule dans le conteneur : /mosquitto/config/mosquitto.conf

# ---------------------------------------------------------------
# MQTTS : listener 8883, TLS 1.2 minimum (cible définitive)
# Certificats montés en lecture seule depuis infra/mosquitto/certs/
# (non versionné). Pas de certificat client exigé : l'authentification
# se fait par login/mot de passe, protégé par le tunnel TLS.
# ---------------------------------------------------------------
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

# ---------------------------------------------------------------
# TEMPORAIRE : listener 1883 en clair, AVEC authentification et ACL,
# conservé uniquement le temps que DEV valide le TLS (8883) sur l'ESP.
# À SUPPRIMER (ici et dans docker-compose.yml) dès cette validation,
# avant le pentest de jeudi.
# ---------------------------------------------------------------
listener 1883
protocol mqtt

# Authentification obligatoire + ACL par topic (communes aux deux listeners)
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Limites (protection DoS basique, pentest de jeudi)
max_connections 50
max_packet_size 65536
max_inflight_messages 20
max_queued_messages 1000
persistent_client_expiration 7d

# Persistance
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Logs : stdout uniquement (rotation par Docker : json-file 10m x 3, cf. daemon.json)
# Consultation : docker compose logs mosquitto
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
