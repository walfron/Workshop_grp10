# Sentinel-X — Mosquitto 2.0 (broker MQTT du Pi)
# Monté en lecture seule dans le conteneur : /mosquitto/config/mosquitto.conf

# ---------------------------------------------------------------
# TEMPORAIRE : passer en 8883/TLS avant jeudi
# Listener en clair pour l'intégration DEV/IA, AVEC authentification.
# Cible : listener 8883, tls_version tlsv1.2, cafile/certfile/keyfile
#         depuis /mosquitto/certs/, et suppression de ce listener 1883.
# ---------------------------------------------------------------
listener 1883
protocol mqtt

# Authentification obligatoire + ACL par topic
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Limites (protection DoS basique, pentest de jeudi)
max_connections 50
max_packet_size 65536
max_inflight_messages 20
max_queued_messages 1000
persistent_client_expiration 7d

# Persistance
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Logs : stdout uniquement (rotation par Docker : json-file 10m x 3, cf. daemon.json)
# Consultation : docker compose logs mosquitto
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
