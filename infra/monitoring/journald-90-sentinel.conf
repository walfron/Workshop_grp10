# Sentinel-X — installé dans /etc/systemd/journald.conf.d/90-sentinel.conf
# Limite la place des journaux système sur la carte SD (MCO).
# Les logs des conteneurs ne passent pas par journald : driver json-file,
# rotation 10 Mo x 3 par conteneur (/etc/docker/daemon.json).
[Journal]
SystemMaxUse=100M
SystemMaxFileSize=20M
