# Sentinel-X — chrony (serveur de temps du Pi pour les ESP8266)
# Installé dans /etc/chrony/chrony.conf (remplace la config Debian, sauvegardée
# en chrony.conf.debian). Aucun secret : versionné.
#
# Rôle : client NTP en amont via eth0 (seule route par défaut),
#        serveur NTP UNIQUEMENT pour le Wi-Fi de la table (192.168.10.0/24).
# Sans heure valide, l'ESP refuse le certificat TLS du broker (8883).

# ---------------------------------------------------------------
# Sources en amont (via eth0)
# ---------------------------------------------------------------
# NTS (NTP authentifié, TCP 4460 vérifié joignable depuis le réseau de l'école) :
# empêche un attaquant sur le réseau de l'école de décaler l'heure du Pi
# (et donc celle des ESP) par de fausses réponses NTP.
server time.cloudflare.com iburst nts
server ptbtime1.ptb.de iburst nts
# Repli non authentifié si le port 4460 est bloqué. En mode "mix" (défaut),
# chrony n'utilise ces sources que si elles concordent avec les sources NTS.
pool 2.debian.pool.ntp.org iburst maxsources 2
authselectmode mix
# Serveur NTP annoncé par le DHCP d'eth0, si l'école en fournit un un jour
# (hook NetworkManager du paquet chrony). Aucun à ce jour.
sourcedir /run/chrony-dhcp

# Pas de pile RTC : au démarrage à froid, l'horloge peut être très fausse.
# - le certificat du serveur NTS ne peut pas être vérifié avec une heure fausse :
#   on ne vérifie pas les dates du certificat pour la toute première mise à jour ;
# - correction par saut (step) autorisée à tout moment si l'écart dépasse 1 s
#   (cas d'eth0 branché après le démarrage : sinon rattrapage très lent).
#   Risque limité tant que les sources NTS sont joignables ; si seul le pool
#   non authentifié répond, un saut forgé reste possible (risque documenté).
nocerttimecheck 1
makestep 1 -1
maxupdateskew 100.0

# Recopie périodique de l'heure système dans la RTC du Pi 5 (mode 11 minutes).
rtcsync

# ---------------------------------------------------------------
# Service NTP pour le Wi-Fi de la table uniquement
# ---------------------------------------------------------------
# Socket serveur lié à l'IP du point d'accès (ip_nonlocal_bind=1 : possible
# même avant que wlan0 ne monte). Rien n'écoute en 123/udp sur 192.168.41.123.
bindaddress 192.168.10.10
allow 192.168.10.0/24
# Continue de servir l'heure (stratum 10) si eth0 perd internet (démo).
local stratum 10
# Limitation de débit (DoS / amplification au pentest) : un ESP interroge
# toutes les quelques minutes au plus.
ratelimit interval 3 burst 8 leak 2

# ---------------------------------------------------------------
# Administration : chronyc en local uniquement (socket Unix /run/chrony/)
# ---------------------------------------------------------------
cmdport 0

# ---------------------------------------------------------------
# Fichiers (valeurs Debian)
# ---------------------------------------------------------------
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
leapsectz right/UTC
