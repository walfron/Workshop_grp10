# Sentinel-X — drop-in : /etc/systemd/system/fake-hwclock-load.service.d/forward-only.conf
#
# Pas de pile RTC : après une coupure de courant, la RTC du Pi 5 repart d'une
# date ancienne et l'ESP refuserait le certificat du broker (notBefore).
# fake-hwclock restaure alors la dernière heure sauvegardée (horaire + arrêt).
#
# Bug de fake-hwclock 0.14 (Debian) : "load" sans "force" règle l'horloge MÊME
# en arrière (condition inversée, contraire à fake-hwclock(8)) -> au boot à
# chaud, l'heure exacte de la RTC serait ramenée à la dernière sauvegarde.
# On remplace donc la commande par un chargement qui ne fait QU'AVANCER
# l'horloge, indépendant de ce bug (et d'une future correction).
[Service]
ExecStart=
ExecStart=/bin/sh -c 'S=$(date -u -d "$(cat /etc/fake-hwclock.data)" +%%s) || exit 0; N=$(date -u +%%s); if [ "$N" -lt "$S" ]; then date -u -s "@$S"; echo "fake-hwclock: horloge avancée à la dernière heure sauvegardée"; else echo "fake-hwclock: horloge déjà plus récente que la sauvegarde, inchangée"; fi'
