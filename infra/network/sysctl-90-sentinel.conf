# Sentinel-X — installé dans /etc/sysctl.d/90-sentinel.conf
# Permet à Docker de publier 192.168.10.10:8883 au boot même si l'AP (wlan0)
# n'a pas encore son IP (sinon : "cannot assign requested address", sans nouvel essai).
# Risque accepté (matrice de sécurité) : un processus local peut se lier à une IP absente.
net.ipv4.ip_nonlocal_bind = 1
