# Sentinel-X — installé dans /etc/NetworkManager/conf.d/90-sentinel.conf
# Le mode "shared" (point d'accès) n'ajoute NI masquerade NI règle de forwarding :
# l'isolation est gérée par sentinel-isolation.service.
# Conséquence : autoriser le DHCP (udp/67) sur wlan0 dans UFW quand il sera activé.
[main]
firewall-backend=none
