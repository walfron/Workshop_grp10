# Durcissement SSH du Pi Sentinel-X (filière INFRA)
# Déployé dans /etc/ssh/sshd_config.d/10-sentinel.conf (root:root 644).
# Préfixe 10 : lu avant 50-cloud-init.conf. OpenSSH garde la PREMIÈRE
# valeur lue pour chaque option, ces réglages l'emportent donc.

# Authentification par clé uniquement
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# Pas de connexion root, seul le compte d'administration est accepté
PermitRootLogin no
AllowUsers sentinel

# Limite les tentatives et les connexions pendantes (bruteforce / DoS)
MaxAuthTries 3
LoginGraceTime 30

# Aucun transfert graphique
X11Forwarding no
