# Sentinel-X : durcissement noyau / réseau (filière INFRA)
# Installé dans /etc/sysctl.d/95-sentinel-hardening.conf.
# NE PAS mettre net.ipv4.ip_forward à 0 : Docker en a besoin (conteneurs).
# net.ipv4.ip_nonlocal_bind reste à 1 (90-sentinel.conf, risque R4 accepté).

# Anti-usurpation : filtrage strict du chemin de retour (IP source incohérente
# avec l'interface d'arrivée = rejet), journal des paquets « martiens »
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Le noyau applique max(all, interface) : systemd (50-default.conf) met
# « net.ipv4.conf.*.rp_filter = 2 » sur chaque interface, il faut donc les nommer.
net.ipv4.conf.eth0.rp_filter = 1
net.ipv4.conf.wlan0.rp_filter = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Redirections ICMP : ni acceptées (MitM par détournement de route), ni envoyées
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.default.accept_source_route = 0

# IPv6 non utilisé : pas d'annonces de routeur (RA) acceptées
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Résistance aux SYN flood (DoS du pentest)
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_rfc1337 = 1

# Noyau : moins d'informations pour un attaquant local
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
net.core.bpf_jit_harden = 2
kernel.sysrq = 0
fs.protected_fifos = 2
